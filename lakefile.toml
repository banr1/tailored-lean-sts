name = "sts-framework"
version = "0.1.0"

# Mathlib rev must match lean-toolchain (leanprover/lean4:v4.32.2). Lake resolves one rev per
# dependency name across a whole build graph and builds it under one toolchain, so a package
# that requires this one has to agree on both. Bump the two together.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

# One `lean_lib` per flavour. Nothing is shared between them by design, so a build touches only
# the flavour that is imported, and a flavour may diverge without touching the others. The
# module root is the flavour name: `import StsMultisetLog.Spec.Protocol`.

# suggested, most general: multiset message log; `Spec/` states, `Analysis/` proves, `Examples/` demonstrates; the long applied types drawn from section variables
[[lean_lib]]
name = "StsMultisetLog"
globs = ["StsMultisetLog", "StsMultisetLog.+"]

# alternative: `Step` is an `inductive` with a derived `Enabled`
[[lean_lib]]
name = "StsStepInductive"
globs = ["StsStepInductive", "StsStepInductive.+"]

# alternative: the reaction is carried in the label, as a payload over the action
[[lean_lib]]
name = "StsReactionInLabel"
globs = ["StsReactionInLabel", "StsReactionInLabel.+"]

# alternative: conditions stated once and cited, in three spellings proved equal
[[lean_lib]]
name = "StsConditionSplit"
globs = ["StsConditionSplit", "StsConditionSplit.+"]

# the original attempt, before the one-choice-at-a-time forks (upstream `Sts2`, presentation B in CONTEXT.md's comparison; never named `Sts2` here, since that lib name is taken elsewhere in the build graph)
[[lean_lib]]
name = "StsRelationalSetLog"
globs = ["StsRelationalSetLog", "StsRelationalSetLog.+"]

# A worked example, not a flavour: the Majorum protocol model, over the suggested flavour.
# `Examples/<flavour>/<protocol>` is the layout, so a second example over a different flavour
# sits beside this one without either knowing about the other.
[[lean_lib]]
name = "MajorumExample"
roots = ["Examples.StsMultisetLog.majorum"]
globs = ["Examples.StsMultisetLog.majorum", "Examples.StsMultisetLog.majorum.+"]
